    <h1>Lean CIビルドの計測結果</h1>
    <p>mainへのpush時の既存CIビルドを0.25秒間隔で採取。保持期限内のartifactから作成しています。</p>
    <p>プロセスツリーPSSはビルド中の合計、モジュールPSSは代表ファイルをコンパイルする単一プロセスのピークです。短いピークは見逃すことがあり、CIのフルビルドはエディターの増分作業そのものではありません。runner、Lean、Coreの変更にも注意してください。グラフの横軸は実行順です。</p>
    <p id="status">読み込み中…</p>
    <div id="results"></div>
  </main>
