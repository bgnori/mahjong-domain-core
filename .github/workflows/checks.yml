name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: mahjong-domain-core
            sources: MahjongDomain
            targets: MahjongDomain
          - package: mahjong-wait-classification
            sources: Mahjong MahjongTests ../mahjong-domain-core/MahjongDomain
            targets: Mahjong MahjongTests
          - package: mahjong-shanten-calculation
            sources: Shanten ../mahjong-domain-core/MahjongDomain
            targets: Shanten
    env:
      LEAN_NUM_THREADS: "2"
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Check out candidate Core
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: mahjong-domain-core
      - name: Check out consumer main
        if: matrix.package != 'mahjong-domain-core'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: bgnori/${{ matrix.package }}
          ref: main
          path: ${{ matrix.package }}
      - name: Record tested revisions
        run: |
          for repository in mahjong-domain-core mahjong-wait-classification mahjong-shanten-calculation; do
            if [ -d "../$repository/.git" ]; then
              printf '%s: %s\n' "$repository" "$(git -C "../$repository" rev-parse HEAD)" \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean toolchain
        run: elan toolchain install "$(cat lean-toolchain)"
      - name: Fetch imported Mathlib cache
        run: |
          lake exe cache get $(find ${{ matrix.sources }} -name '*.lean' \
            -exec sed -n 's/^\(public \)\?import \(Mathlib\..*\)$/\2/p' {} + | sort -u)
      - name: Test build sampler
        if: matrix.package == 'mahjong-domain-core'
        run: python3 -m unittest discover -s scripts -p 'test_measure_lean_build.py'
      - name: Build and check proofs
        run: |
          if [ "${{ matrix.package }}" = mahjong-domain-core ]; then
            python3 scripts/measure_lean_build.py \
              --output "$RUNNER_TEMP/lean-build-metrics.json" \
              --module MahjongDomain/Hand.lean -- lake build ${{ matrix.targets }}
          else
            lake build ${{ matrix.targets }}
          fi
      - name: Save Lean build metrics
        if: matrix.package == 'mahjong-domain-core' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-build-metrics-v1
          path: ${{ runner.temp }}/lean-build-metrics.json
          if-no-files-found: error
          overwrite: true
